controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_controller:
      type: mecanum_drive_controller/MecanumDriveController

mecanum_controller:
  ros__parameters:
    reference_timeout: 0.9

    # Joint names match the ensamblaje_v2 URDF (home_base prefix)
    front_left_wheel_command_joint_name: home_base_wheel_FL_joint
    front_right_wheel_command_joint_name: home_base_wheel_FR_joint
    rear_left_wheel_command_joint_name: home_base_wheel_RL_joint
    rear_right_wheel_command_joint_name: home_base_wheel_RR_joint

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.0762  # 3 inches
      # lx + ly where lx=0.1848 (half wheelbase), ly=0.2194 (half track)
      sum_of_robot_center_projection_on_X_Y_axis: 0.4042

    cmd_vel_timeout: 0.5
    use_stamped_vel: false

    # Frame configuration
    odom_frame_id: odom
    base_frame_id: home_base_base_link

    # Publishing
    publish_rate: 50.0
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    enable_odom_tf: true
